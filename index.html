<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWave</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="inter-font">
    <header>
        <nav class="navbar">
            <h1 class="logo">Tech<span class="lg">Wave</span></h1>
            <div class="manu">
                <ul>
                    <li>About</li>
                    <li>Episodes</li>
                    <li>Host</li>
                </ul>
            </div>
            <button class="btn lg">Subscribe <i class="fa-solid fa-arrow-right  tp"></i></button>
        </nav>
    </header>
    <main>
        <section class="banner">
            <div class="b">
                <div class="b-img">
                    <img class="b-img1" src="assets/hero-circle.png" alt="">
                    <img class="b-img2" src="assets/microphone.png" alt="">
                    <h3 class="b-img3">NEW</h3>
                </div>
                <div class="b-text">
                    <h1 class="logo">TechWave</h1>
                    <h4 class="font1">Your daily dose of tech insights, productivity hacks, and personal growth</h4>
                    <div class="banner-btn">
                        <button class="b-btn1 btn lg"><img class="tp" src="assets/spotify.png" alt="">  Listen on Spotify</button>
                        <button class="b-btn2 btn"><img src="assets/message.png" alt="">    Subscribe</button>
                    </div>
                </div>
            </div>
        </section>
        
</body>
</html>
